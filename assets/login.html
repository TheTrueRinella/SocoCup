<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso · SocoCup</title><link rel="stylesheet" href="assets/style.css"><style>body{background:#0a1022;color:#fff}.testwrap{max-width:480px;margin:8vh auto;padding:24px}.testbox{padding:26px;border:1px solid #48506d;border-radius:18px;background:#171c34}select,input,button{width:100%;padding:13px;margin:9px 0;border-radius:9px;font-size:16px}input{letter-spacing:.45em;text-align:center}#loggedin{display:none}body.is-logged-in #loginform{display:none}body.is-logged-in #loggedin{display:block}button{background:#ef8d32;border:0;font-weight:bold;cursor:pointer}.muted{color:#b7bdd3}#status{white-space:pre-wrap}.pinboxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 20px}.pinboxes .digit{box-sizing:border-box;min-width:0;width:100%;padding:13px 0;text-align:center;letter-spacing:normal;font-size:25px}.pinboxes .digit:focus{outline:3px solid #ef8d32}#logout{margin-top:20px}</style><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><main class="testwrap"><h1>SocoCup · Accesso</h1><p class="muted">Accedi con la tua fantasquadra. Non condividere il PIN.</p><section class="testbox"><div id="loginform"><label for="team">Fantasquadra</label><select id="team"><option value="">Scegli la squadra</option></select><label for="pin">PIN (5 cifre)</label><div class="pinboxes" id="pinboxes" aria-label="PIN di cinque cifre"><input class="digit" aria-label="Prima cifra" inputmode="numeric" autocomplete="one-time-code" maxlength="1" type="password"><input class="digit" aria-label="Seconda cifra" inputmode="numeric" maxlength="1" type="password"><input class="digit" aria-label="Terza cifra" inputmode="numeric" maxlength="1" type="password"><input class="digit" aria-label="Quarta cifra" inputmode="numeric" maxlength="1" type="password"><input class="digit" aria-label="Quinta cifra" inputmode="numeric" maxlength="1" type="password"></div><button id="login">Accedi</button></div><div id="loggedin"><h2 id="welcome">Accesso attivo</h2><p>La tua squadra è già collegata su questo dispositivo.</p><a href="index.html" style="color:#f6a45c">Vai al portale →</a></div><button id="logout" style="background:#a9b0c5">Esci da questa sessione</button><p id="status" role="status">Verifica sessione…</p></section><p><a href="index.html" style="color:#f6a45c">← Torna al portale</a></p></main><script>
window.addEventListener('load',async()=>{
const URL='https://ckpmsdxkxhdqqcbnmhjp.supabase.co';
const KEY='sb_publishable_vBBxybG-Q4tkkOLYM_mDlA_ZTA35etI';
const names=['Berlusca Dortmund','STOKE AZZO','Palermo Saint-Rosalia','Hertavernello','Aston Birra','Lamin Kiadura','ipsiwich down','Vecio Lanificio Rossi United','palermo','Ciccio Kebab FC'];
const el=id=>document.getElementById(id),status=s=>el('status').textContent=s;
const digits=[...document.querySelectorAll('.digit')];
digits.forEach((field,i)=>{field.addEventListener('input',()=>{const value=field.value.replace(/\D/g,'');field.value=value.slice(-1);if(field.value&&i<4)digits[i+1].focus()});field.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!field.value&&i>0)digits[i-1].focus();if(e.key==='Enter')el('login').click()});field.addEventListener('paste',e=>{e.preventDefault();const pasted=(e.clipboardData?.getData('text')||'').replace(/\D/g,'').slice(0,5);pasted.split('').forEach((d,j)=>{if(digits[i+j])digits[i+j].value=d});digits[Math.min(4,i+pasted.length)].focus()})});
names.forEach((name,i)=>{const o=document.createElement('option');o.value=String(i+1);o.textContent=name;el('team').append(o)});
if(!window.supabase){status('Libreria Supabase non caricata. Controlla la connessione.');return}
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
async function checkProfile(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {data,error}=await sb.from('sococup_profiles').select('team_id').eq('user_id',session.user.id).maybeSingle();if(error){status('Impossibile verificare la squadra: '+error.message);return false}if(data&&Number.isInteger(Number(data.team_id))&&names[Number(data.team_id)-1]){document.body.classList.add('is-logged-in');el('welcome').textContent='Bentornato, '+names[Number(data.team_id)-1]+'!';status('Sessione riconosciuta automaticamente.');return true}return false}
async function getSession(){let {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;session=r.data.session}return session}
try{const known=await checkProfile();if(!known){const s=await getSession();if(!el('status').textContent.startsWith('Impossibile verificare'))status(s?'Sessione pronta. Seleziona squadra e PIN.':'Impossibile creare la sessione.')}}catch(e){status('Impossibile creare sessione anonima: '+e.message+'. Controlla che Anonymous Sign-ins sia attivo in Supabase Auth.')}
el('login').addEventListener('click',async()=>{const team_id=Number(el('team').value),pin=digits.map(d=>d.value).join(''); if(!team_id||!/^[0-9]{5}$/.test(pin)){status('Seleziona una squadra e inserisci esattamente 5 cifre.');return}el('login').disabled=true;status('Verifica in corso…');try{const s=await getSession();const r=await fetch(URL+'/functions/v1/sococup-team-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+s.access_token},body:JSON.stringify({team_id,pin})});const body=await r.json().catch(()=>({}));if(r.ok&&body.success){document.body.classList.add('is-logged-in');el('welcome').textContent='Benvenuto, '+names[team_id-1]+'!';status('Accesso riuscito. Verifica chiudendo e riaprendo questa pagina.')}else{status('Accesso non riuscito ('+r.status+'): '+(body.message||'Verifica i log della funzione.'))}}catch(e){status('Errore di rete: '+e.message)}finally{digits.forEach(d=>d.value='');el('login').disabled=false}});
el('logout').addEventListener('click',async()=>{await sb.auth.signOut();document.body.classList.remove('is-logged-in');el('team').value='';digits.forEach(d=>d.value='');status('Disconnesso. Puoi scegliere una squadra e accedere nuovamente.')});
});</script></body></html>
